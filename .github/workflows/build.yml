name: Luminex validation and release package
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Load public client configuration
        run: cp .env.example .env.local
      - name: TypeScript validation
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Package source release
        run: zip -r Luminex-Edge-Logistics-Release.zip . -x '.git/*' 'node_modules/*' '.next/*' '.netlify/*' '.env' '.env.local' '.env.production'
      - name: Upload release ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Luminex-Edge-Logistics-Release
          path: Luminex-Edge-Logistics-Release.zip
          retention-days: 14
