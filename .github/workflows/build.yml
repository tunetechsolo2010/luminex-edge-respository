name: Luminex manual deployment package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Load public client configuration
        run: cp .env.example .env.local

      - name: TypeScript validation
        run: npm run typecheck

      - name: Build static website
        run: npm run build

      - name: Verify required static pages
        run: |
          test -f out/index.html
          test -f out/admin/index.html
          test -f out/track/index.html
          test -f out/order/index.html
          test -f out/404.html
          echo "Verified homepage, admin, tracking, order document and 404 pages."

      - name: Assemble Netlify drag-and-drop folder
        run: |
          mkdir -p Luminex-Edge-Logistics-Deploy
          cp -a out/. Luminex-Edge-Logistics-Deploy/

      - name: Add deployment instructions
        run: |
          cat > Luminex-Edge-Logistics-Deploy/DEPLOY-TO-NETLIFY.txt <<'EOF'
          LUMINEX EDGE LOGISTICS — READY-TO-DEPLOY WEBSITE

          This folder contains the BUILT STATIC WEBSITE, not source code.
          It should contain index.html, admin/, track/, order/, _next/ and assets.

          MANUAL DEPLOY:
          1. Extract this ZIP on your Android phone.
          2. Open Netlify in your browser and sign in.
          3. Open the EXISTING site named lumgelogistics.
          4. Open Deploys and locate the manual deploy / drag-and-drop area.
          5. Upload the extracted Luminex-Edge-Logistics-Deploy folder.
          6. Wait for Netlify to finish publishing, then open:
             https://lumgelogistics.netlify.app

          IMPORTANT:
          - Upload this folder's contents as a built website. Do not upload the
            GitHub source repository or the inner source-code ZIP.
          - This package does not connect GitHub to Netlify and does not deploy
            automatically.
          - The order document uses /order/?deliveryId=DELIVERY_ID.
          - Customer sign-in continues to use Firebase Authentication.
          - Customer, order, tracking, admin and advertising data continue to
            use the configured Supabase Edge Functions.
          - Never add Supabase service-role keys or Paystack secret keys here.
          EOF

      - name: Create deployment ZIP
        run: zip -qr Luminex-Edge-Logistics-Deploy.zip Luminex-Edge-Logistics-Deploy

      - name: Upload manual-deploy package
        uses: actions/upload-artifact@v4
        with:
          name: Luminex-Edge-Logistics-Deploy
          path: Luminex-Edge-Logistics-Deploy.zip
          retention-days: 30
