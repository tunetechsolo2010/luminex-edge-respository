name: Luminex manual deployment package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Load public client configuration
        run: cp .env.example .env.local

      - name: TypeScript validation
        run: npm run typecheck

      - name: Production build validation
        run: npm run build

      - name: Assemble manual-deploy folder
        run: |
          mkdir -p Luminex-Edge-Logistics-Deploy
          rsync -a ./ Luminex-Edge-Logistics-Deploy/ \
            --exclude='.git/' \
            --exclude='node_modules/' \
            --exclude='.next/' \
            --exclude='.netlify/' \
            --exclude='.env' \
            --exclude='.env.local' \
            --exclude='.env.*.local' \
            --exclude='Luminex-Edge-Logistics-Deploy/'

      - name: Add manual deployment instructions
        run: |
          cat > Luminex-Edge-Logistics-Deploy/DEPLOY-TO-NETLIFY.txt <<'EOF'
          LUMINEX EDGE LOGISTICS — MANUAL NETLIFY DEPLOY

          This is the source project folder. It has passed the GitHub Actions
          TypeScript and Next.js production-build checks.

          IMPORTANT:
          1. Sign in to Netlify in your browser.
          2. Open the EXISTING project named lumgelogistics.
          3. Open its Deploys page.
          4. Use the manual deploy / drag-and-drop area and upload this entire
             extracted folder (the folder containing package.json and netlify.toml).
          5. Stay signed in so Netlify can detect Next.js and run the build.
          6. Wait for the deploy to finish before checking the live site.

          This package does not connect GitHub to Netlify and does not trigger
          a Netlify deployment by itself. Do not upload only app/, public/, or
          an individual source file. Upload the complete folder.

          Existing Supabase and Firebase public client configuration is in
          .env.example. Do not add private service-role keys or Paystack secret
          keys to this folder or to any NEXT_PUBLIC_ variable.
          EOF

      - name: Create deployment ZIP
        run: zip -qr Luminex-Edge-Logistics-Deploy.zip Luminex-Edge-Logistics-Deploy

      - name: Upload manual-deploy package
        uses: actions/upload-artifact@v4
        with:
          name: Luminex-Edge-Logistics-Deploy
          path: Luminex-Edge-Logistics-Deploy.zip
          retention-days: 30
